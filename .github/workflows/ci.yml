name: CI

on:
  push:
  pull_request:

jobs:
  linux-test:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fetch
        run: cargo fetch --locked
      - name: cargo fmt
        run: cargo fmt --all -- --check
        env:
          CARGO_NET_OFFLINE: "true"
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"
      - name: cargo test
        run: cargo test --locked
        env:
          CARGO_NET_OFFLINE: "true"

  windows-test:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fetch
        run: cargo fetch --locked
      - name: cargo test
        run: cargo test --locked
        env:
          CARGO_NET_OFFLINE: "true"

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Cargo 1.80 cannot parse edition-2024 manifests that appear in the
      # lockfile as unused target-only crates (getrandom -> wasip2 ->
      # wit-bindgen). Fetch *only* the host target so those crates are skipped.
      # Do not fetch with stable then check 1.80 offline: registry index
      # directories differ across cargo versions and 1.80 reports
      # "no matching package named `blake3`".
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.80"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv-1.80
      - name: cargo fetch
        run: cargo +1.80 fetch --locked --target x86_64-unknown-linux-gnu
      - name: cargo check
        run: cargo +1.80 check --locked --target x86_64-unknown-linux-gnu
        env:
          CARGO_NET_OFFLINE: "true"
