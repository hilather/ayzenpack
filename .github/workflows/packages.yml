# Rocky Linux 8 and 9 RPM + tarball distribution, cosign keyless sign, GitHub Release.
#
# Hardening from ratarmount-rs packages.yml:
#   - container jobs force bash (default is sh)
#   - dnf: --allowerasing (curl-minimal), never full coreutils
#   - Rocky 8 PowerTools / Rocky 9 CRB
#   - rustup PATH + source ~/.cargo/env (exit 127 = cargo not on PATH)
#   - tag version must match Cargo.toml (packaging/test-version-resolve.sh)
#   - skip 0-byte GitHub Release assets
#   - REST upload, not `gh release create` with a file glob
#   - never run tests under the release profile (panic = abort)
#
# Triggers: tag v*, workflow_dispatch, packaging PR paths
name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/packages.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: v2.41.3

jobs:
  rpm:
    name: rpm (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: rocky8-amd64
            runner: ubuntu-latest
            image: rockylinux/rockylinux:8
            distro_label: rocky-8
            rocky_release: "8"
          - label: rocky9-amd64
            runner: ubuntu-latest
            image: rockylinux/rockylinux:9
            distro_label: rocky-9
            rocky_release: "9"
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build deps (dnf)
        run: |
          set -euo pipefail
          chmod +x packaging/install-rocky-build-deps.sh
          bash packaging/install-rocky-build-deps.sh "${{ matrix.rocky_release }}"

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 3 --max-time 60 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          command -v rustc
          command -v cargo
          rustc --version
          cargo --version

      - name: Resolve package version
        run: |
          set -euo pipefail
          chmod +x packaging/test-version-resolve.sh
          bash packaging/test-version-resolve.sh --resolve | tee -a "$GITHUB_ENV"

      - name: Build .rpm + tarball
        env:
          PACKAGE_FAMILY: rpm
          DISTRO_LABEL: ${{ matrix.distro_label }}
          OUT_DIR: dist
        run: |
          set -euo pipefail
          # Rocky 9 GHA used to exit 127 here when cargo was not on PATH.
          # shellcheck disable=SC1091
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          hash -r || true
          test -n "${VERSION:-}"
          command -v cargo
          cargo --version
          chmod +x packaging/build-native-packages.sh
          bash packaging/build-native-packages.sh
          test -s dist/*.rpm
          test -s dist/*.tar.gz
          file target/release/ayzenpack | tee "dist/file-info-${{ matrix.distro_label }}.txt"
          ./target/release/ayzenpack --help | tee "dist/help-${{ matrix.distro_label }}.txt"
          grep -q dehydrate "dist/help-${{ matrix.distro_label }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.label }}
          path: |
            dist/*.rpm
            dist/*.tar.gz
            dist/*.sha256
            dist/file-info-*.txt
            dist/help-*.txt
          if-no-files-found: error

  release:
    name: Sign & release
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.rpm.result == 'success'
    needs: [rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -size +0c \( \
              -name '*.rpm' -o -name '*.tar.gz' \
              -o -name '*.sha256' -o -name 'file-info*.txt' -o -name 'help-*.txt' \
            \) -exec cp -v {} release/ \;
          cd release
          ls -la
          : > SHA256SUMS
          for f in *.rpm *.tar.gz; do
            [[ -f "$f" ]] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
          test -s SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Cosign keyless sign (OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cd release
          for f in *.rpm *.tar.gz SHA256SUMS; do
            [[ -f "$f" ]] || continue
            echo "Signing $f"
            cosign sign-blob --yes \
              --bundle "${f}.cosign.bundle" \
              "$f"
          done
          ls -la

      - name: Upload signed bundle (always)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-bundle
          path: release/

      - name: Create / update GitHub Release (tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          DEBUG_LOG="${RUNNER_TEMP}/release-debug.log"
          exec > >(tee -a "$DEBUG_LOG") 2>&1
          fail() {
            echo "::error::$1"
            echo "ERROR: $1"
            if [[ -f "$DEBUG_LOG" ]]; then
              echo "::group::release-debug.log"
              cat "$DEBUG_LOG"
              echo "::endgroup::"
            fi
            exit 1
          }
          note() { echo "::notice::$1"; echo "$1"; }

          command -v curl >/dev/null || fail "curl missing"
          command -v jq >/dev/null || fail "jq missing"
          [[ -n "${GITHUB_TOKEN:-}" ]] || fail "GITHUB_TOKEN empty"
          [[ -n "${GITHUB_REPOSITORY:-}" ]] || fail "GITHUB_REPOSITORY empty"
          [[ -n "${TAG:-}" ]] || fail "TAG empty"
          [[ -d release ]] || fail "release/ directory missing"

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=( -H "Authorization: Bearer ${GITHUB_TOKEN}"
                 -H "Accept: application/vnd.github+json"
                 -H "X-GitHub-Api-Version: 2022-11-28" )

          note "Probing token against ${API}"
          probe_body="$(mktemp)"
          probe_code=$(curl -sS -o "$probe_body" -w "%{http_code}" \
            "${AUTH[@]}" "$API" || true)
          if [[ "$probe_code" != "200" ]]; then
            fail "Token cannot read repo (HTTP $probe_code)"
          fi

          cd release
          ls -la
          mapfile -t files < <(
            find . -maxdepth 1 -type f ! -name '.*' -size +0c -printf '%f\n' | sort
          )
          mapfile -t empty_files < <(
            find . -maxdepth 1 -type f ! -name '.*' -size 0c -printf '%f\n' | sort || true
          )
          if [[ ${#empty_files[@]} -gt 0 ]]; then
            note "Skipping empty files (not uploadable): ${empty_files[*]}"
          fi
          note "Asset count: ${#files[@]}"
          printf '  %s\n' "${files[@]}"
          [[ ${#files[@]} -gt 0 ]] || fail "No non-empty files under release/"

          NOTES_FILE="$(mktemp)"
          cat >"$NOTES_FILE" <<'MD'
          ## Packages

          | Kind | Platforms |
          |------|-----------|
          | `.rpm` | Rocky Linux 8 (amd64), Rocky Linux 9 (amd64) |
          | tarball | same (glibc of that distro) |

          Cosign keyless signatures (`.cosign.bundle`) and `SHA256SUMS` are included.

          Workflow artifact fallback: **signed-release-bundle** on the Packages run.
          MD
          sed -i 's/^          //' "$NOTES_FILE"

          create_payload="$(mktemp)"
          jq -n \
            --arg tag "$TAG" \
            --arg name "ayzenpack $TAG" \
            --rawfile body "$NOTES_FILE" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false, make_latest:"true", generate_release_notes:false}' \
            >"$create_payload"

          existing_body="$(mktemp)"
          existing_code=$(curl -sS -o "$existing_body" -w "%{http_code}" \
            "${AUTH[@]}" "${API}/releases/tags/${TAG}" || true)
          echo "GET releases/tags/${TAG} -> HTTP $existing_code"
          if [[ "$existing_code" == "200" ]]; then
            RELEASE_ID=$(jq -r '.id' "$existing_body")
            UPLOAD_URL=$(jq -r '.upload_url' "$existing_body" | sed 's/{?name,label}//')
            note "Updating existing release id=$RELEASE_ID"
            edit_code=$(curl -sS -o /tmp/edit-resp.json -w "%{http_code}" \
              -X PATCH "${AUTH[@]}" \
              -H "Content-Type: application/json" \
              "${API}/releases/${RELEASE_ID}" \
              -d @"$create_payload" || true)
            [[ "$edit_code" == "200" ]] || fail "PATCH release failed HTTP $edit_code: $(cat /tmp/edit-resp.json)"
          else
            note "Creating release for tag $TAG"
            create_body="$(mktemp)"
            create_code=$(curl -sS -o "$create_body" -w "%{http_code}" \
              -X POST "${AUTH[@]}" \
              -H "Content-Type: application/json" \
              "${API}/releases" \
              -d @"$create_payload" || true)
            echo "POST /releases -> HTTP $create_code"
            if [[ "$create_code" != "201" ]]; then
              fail "POST /releases failed HTTP $create_code: $(cat "$create_body")"
            fi
            RELEASE_ID=$(jq -r '.id' "$create_body")
            UPLOAD_URL=$(jq -r '.upload_url' "$create_body" | sed 's/{?name,label}//')
            note "Created release id=$RELEASE_ID"
          fi

          [[ -n "$RELEASE_ID" && "$RELEASE_ID" != "null" ]] || fail "No release id"
          [[ -n "$UPLOAD_URL" && "$UPLOAD_URL" != "null" ]] || fail "No upload_url"

          for f in "${files[@]}"; do
            size=$(stat -c%s "$f")
            note "Uploading $f ($size bytes)"
            assets_json=$(curl -sS "${AUTH[@]}" "${API}/releases/${RELEASE_ID}/assets?per_page=100")
            old_id=$(echo "$assets_json" | jq -r --arg n "$f" '.[] | select(.name==$n) | .id' | head -1)
            if [[ -n "${old_id:-}" && "$old_id" != "null" ]]; then
              echo "Deleting existing asset id=$old_id name=$f"
              curl -sS -X DELETE "${AUTH[@]}" "${API}/releases/assets/${old_id}" >/dev/null || true
            fi
            up_body="$(mktemp)"
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$f")
            up_code=$(curl -sS -o "$up_body" -w "%{http_code}" \
              -X POST "${AUTH[@]}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "${UPLOAD_URL}?name=${encoded}" \
              || true)
            echo "upload $f -> HTTP $up_code"
            if [[ "$up_code" != "201" ]]; then
              cat "$up_body"
              fail "Upload $f failed HTTP $up_code: $(head -c 500 "$up_body")"
            fi
          done

          final=$(curl -sS "${AUTH[@]}" "${API}/releases/${RELEASE_ID}")
          count=$(echo "$final" | jq '.assets | length')
          url=$(echo "$final" | jq -r '.html_url')
          note "Release published: $url ($count assets)"
          echo "$final" | jq '{tag_name, html_url, assets: [.assets[].name]}'
