[package]
name = "ayzenpack"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Dehydrate many JARs into one zstd content-addressed archive and rehydrate them"
readme = "README.md"
authors = ["ayzenpack contributors"]
keywords = ["jar", "zip", "zstd", "dedup", "blake3"]
categories = ["command-line-utilities", "compression"]

[lib]
name = "ayzenpack"
path = "src/lib.rs"

[[bin]]
name = "ayzenpack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# 1.8.3+ is edition 2024 / MSRV 1.85.
blake3 = "=1.8.2"
# 4.6 is edition 2024 / MSRV 1.85. Stay on the 4.5 line (last: 4.5.61, MSRV 1.74).
clap = { version = "~4.5", features = ["derive"] }
# clap_builder 4.5 allows clap_lex ^1; 1.1 is MSRV 1.85 / edition 2024.
clap_lex = "=1.0.1"
crc32fast = "1.5"
glob = "0.3"
hex = "0.4"
indicatif = "0.17"
# zip depends on indexmap ^2; 2.12+ is MSRV 1.82 and 2.14 is 1.85/edition 2024.
indexmap = "=2.11.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# TempDir::keep() landed in 3.20; 3.27 allows getrandom 0.4 (MSRV 1.85).
tempfile = "~3.20"
thiserror = "2.0"
walkdir = "2.5"
# 2.2.x is yanked; 2.4.2 is the last 2.4 (crate MSRV 1.73).
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[dev-dependencies]
# 2.1.3+ is edition 2024 / MSRV 1.85; 2.1.2 deprecates cargo_bin under clippy -D.
assert_cmd = "~2.0"
predicates = "3.1"
# Ecosystem standard for property tests (highly used); random ZIP trees only.
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
