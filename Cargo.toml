[package]
name = "ayzenpack"
version = "0.2.8"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Pack many JARs into one BLAKE3 + zstd content-addressed archive and restore them"
readme = "README.md"
authors = ["ayzenpack contributors"]
keywords = ["jar", "zip", "zstd", "dedup", "blake3"]
categories = ["command-line-utilities", "compression"]
repository = "https://github.com/hilather/ayzenpack"
homepage = "https://github.com/hilather/ayzenpack"
documentation = "https://github.com/hilather/ayzenpack#readme"

[lib]
name = "ayzenpack"
path = "src/lib.rs"

[[bin]]
name = "ayzenpack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# 1.8.3+ is edition 2024 / MSRV 1.85.
blake3 = "=1.8.2"
# 4.6 is edition 2024 / MSRV 1.85. Stay on the 4.5 line (last: 4.5.61, MSRV 1.74).
clap = { version = "~4.5", features = ["derive"] }
# clap_builder 4.5 allows clap_lex ^1; 1.1 is MSRV 1.85 / edition 2024.
clap_lex = "=1.0.1"
crc32fast = "1.5"
glob = "0.3"
hex = "0.4"
indicatif = "0.17"
# zip depends on indexmap ^2; 2.12+ is MSRV 1.82 and 2.14 is 1.85/edition 2024.
indexmap = "=2.11.4"
# 1.11 lists MSRV 1.80 but pulls newer deps; 1.10 is crate MSRV 1.63 and stays on 1.80 lockfile pins.
rayon = "~1.10"
# cc -> jobserver 0.1.35 pulls getrandom 0.4 / wit-bindgen (edition 2024, MSRV 1.85).
jobserver = "=0.1.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# TempDir::keep() landed in 3.20; 3.27 allows getrandom 0.4 (MSRV 1.85).
tempfile = "~3.20"
thiserror = "2.0"
walkdir = "2.5"
# 2.2.x is yanked; 2.4.2 is the last 2.4 (crate MSRV 1.73).
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
zstd = "0.13"
# Already in the tree via zip 2.4.2 (miniz_oxide rust_backend). Direct pin for raw deflate.
# Do not enable zlib / zlib-ng (C backend, different bitstream).
flate2 = "=1.1.9"
# In-process raw DEFLATE for `deflate-raw:zlib:{1,3,6,9}`. Edition 2021 / MSRV 1.75.
# Do not enable flate2's zlib-rs feature (would retcon deflate-raw:flate2:*).
zlib-rs = "=0.6.7"

[dev-dependencies]
# 2.1.3+ is edition 2024 / MSRV 1.85; 2.1.2 deprecates cargo_bin under clippy -D.
assert_cmd = "~2.0"
predicates = "3.1"
# Ecosystem standard for property tests (highly used); random ZIP trees only.
# 1.11 requires rustc 1.85. Stay on a 1.80-safe line.
proptest = "=1.6.0"
# Same pins as [dependencies]; integration fixtures build zlib/flate2 bitstreams.
flate2 = "=1.1.9"
zlib-rs = "=0.6.7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
